name: Deploy

on:
  release:
    types: [published]
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to deploy to'
        required: true
        default: 'testing'
        type: choice
        options:
          - testing
          - production

env:
  DCL_PRIVATE_KEY: ${{ secrets.DCL_WORLDS_PRIVATE_KEY }}
  DEPLOY_ENV: ${{ inputs.environment || (github.event_name == 'release' && 'production') || 'testing' }}

jobs:
  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        # Pin Node to avoid recent fetch/socket regressions affecting
        # Decentraland deploys against the Worlds content server.
        node-version: 22.22.0
        cache: npm
    - name: Install npm packages
      run: |
        if [ -f package-lock.json ]; then
          npm ci
        else
          npm install
        fi
    - name: Build scene
      run: npm run build
    - name: Deploy scene
      run: npm run deploy:${{ env.DEPLOY_ENV }}
